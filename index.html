<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* Background layer */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("background.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12px);
      transform: scale(1.05); /* prevents edges from showing after blur */
      z-index: -1;
    }
  </style>
</head>

<body>

  <!-- Blurred Background -->
  <div class="bg"></div>

  <!-- Chat Widget -->
<script
  src="wide-chat-widget.js"
  data-endpoint="https://alisamir82.app.n8n.cloud/webhook/b7763ad9-4bba-429f-83f1-8867ad816b18"
  data-chat-id="canon-wide"
  data-title="Canon Product Assistant"
  data-primary="#0060df"
  defer
></script>

</body>
</html>

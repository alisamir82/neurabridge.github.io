<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URL Preview Test</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f3f3f3;
    }

    .card {
      width: 360px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 8px;
      background: #fafafa;
    }

    .card-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .card-url {
      font-size: 12px;
      color: #555;
      word-break: break-all;
    }
  </style>
</head>
<body>

<h2>URL Preview Test</h2>

<div class="card">
  <img src="https://www.canon.co.uk/store/canon-eos-r5-mirrorless-camera-rf-24-105mm-f4l-is-usm-lens/4147C068/" alt="Preview Image">
  <div>
    <div class="card-title">canon-eos-r5-mirrorless-camera-rf-24-105mm-f4l-is-usm-lens</div>
    <div class="card-url">https://www.canon.co.uk/store/canon-eos-r5-mirrorless-camera-rf-24-105mm-f4l-is-usm-lens/4147C068/</div>
  </div>
</div>

</body>
</html>
